name: Generate Serverino Skill Archive

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'examples/**'
      - 'docs/llms.txt'
      - 'docs/llms-full.txt'
      - '.github/workflows/skills.yml'
  workflow_dispatch:

jobs:
  build-and-deploy-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Serverino Codebase
        uses: actions/checkout@v4

      - name: Create Skill Directory structure
        run: |
          mkdir -p build/serverino/wiki
          mkdir -p build/serverino/examples

      - name: Copy LLM Docs from the checkout
        run: |
          # Taken from the repository, not from GitHub Pages: this way the skill always
          # matches the commit that triggered the run, and a failed fetch cannot end up
          # packaged as a silently broken skill.
          cp docs/llms.txt docs/llms-full.txt build/serverino/

      - name: Clone Wiki Tips
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/trikko/serverino.wiki.git temp_wiki
          cp temp_wiki/*.md build/serverino/wiki/
          rm -rf temp_wiki

      - name: Copy Examples from codebase
        run: |
          cp -r examples/* build/serverino/examples/

      - name: Copy the rules
        run: |
          # One source for the rules: the same file the website serves at /AGENTS.md.
          cp docs/AGENTS.md build/serverino/

      - name: Generate SKILL.md
        run: |
          cat << 'EOF' > build/serverino/SKILL.md
          ---
          name: serverino-dlang
          description: Official documentation, examples, and guides for Serverino, a zero-dependency HTTP/WebSocket server for the D programming language. Use this whenever the user asks questions about Serverino or web development in D.
          ---

          # Serverino - HTTP/WebSocket Server for D

          Serverino is a zero-dependency, multi-process HTTP and WebSocket server library for the D
          programming language (dlang).

          **Asset directory**: `${CLAUDE_SKILL_DIR}`

          Everything needed to write correct Serverino code is in this skill. Read from it rather
          than recalling: the library is small enough to be rare in training data, and a guess
          usually comes out looking like vibe.d or Node.

          1. `AGENTS.md` - the rules that are easiest to get wrong. Start here.
          2. `llms-full.txt` - the complete API in one file: configuration, UDAs, `Request`,
             `Output`, `FormData`, WebSockets, worked examples. `llms.txt` is the short overview.
          3. `wiki/` - recipes: authorization, docker, systemd, redirects, sessions, reading a
             posted file, running a thread beside serverino, multiple source files.
          4. `examples/` - complete programs, one directory each, from hello world to a server
             that renews its own Let's Encrypt certificate.

          When an answer depends on a signature, check it against `llms-full.txt` before writing it.
          EOF

      - name: Zip the Skill folder
        run: |
          cd build
          zip -r ../serverino-skill.zip serverino/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: serverino-skill
          path: serverino-skill.zip
