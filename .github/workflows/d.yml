# separate terms of service, privacy policy, and support
# documentation.
name: BUILD & TEST

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest, ubuntu-24.04-arm]
        dc: [ldc-latest, dmd-2.109.0, dmd-latest]
        exclude:
        - os: ubuntu-24.04-arm
          dc: dmd-2.109.0
        - os: ubuntu-24.04-arm
          dc: dmd-latest
        - os: macos-14
          dc: dmd-2.109.0
        - os: macos-14
          dc: dmd-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Run sanity checks
        if: ${{ matrix.dc != 'ldc-latest' }}
        run: echo "import serverino; mixin ServerinoMain; @endpoint void a(Output o) { }" | dmd -i -Isource -ofinline_1 - &&
             echo "import serverino; mixin ServerinoMain; @endpoint void a(Request r, Output o) { }" | dmd -i -Isource -ofinline_2 - &&
             echo "import serverino; mixin ServerinoMain; @endpoint void a(Request r) { }" | dmd -i -Isource -ofinline_3 - &&
             echo "import serverino; mixin ServerinoBackground; @endpoint void a(Request r) { } void main() { }" | dmd -i -Isource -ofinline_4 -

      - name: Setup OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl
          echo "CPATH=$(brew --prefix openssl)/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix openssl)/lib" >> $GITHUB_ENV
          echo "$(brew --prefix openssl)/bin" >> $GITHUB_PATH
          
      - name: Run test-01
        run: dub run --root=tests/test-01

      - name: Run test-02
        run: dub run --root=tests/test-02

      - name: Run test-03
        run: dub run --root=tests/test-03

      - name: Run test-04 (https)
        if: ${{ matrix.os != 'windows-latest' }}
        run: dub run --root=tests/test-04

      # The same binary runs several times: it's built once, since on Windows an exe
      # can't be relinked while its workers are still running.
      - name: Build test-05
        run: dub build --root=tests/test-05

      - name: Run test-05 (1-2 workers, with and without worker backlog)
        shell: bash
        run: |
          # The workers of a run can outlive it for a moment: wait for them before the next one
          wait_workers() {
            for i in $(seq 1 30); do
              if [ "$RUNNER_OS" = "Windows" ]; then
                tasklist //FI "IMAGENAME eq test-05.exe" | grep -q test-05.exe || return 0
              else
                pgrep -x test-05 > /dev/null || return 0
              fi
              sleep 1
            done
            echo "::warning::test-05 processes still running 30s after the end of the test"
          }

          for workers in 1 2; do
            for backlog in 0 1; do
              echo "== workers: $workers, backlog: $backlog"
              SERVERINO_TEST_WORKERS=$workers SERVERINO_TEST_BACKLOG=$backlog ./tests/test-05/test-05

              # DIAGNOSTICS: who is still alive, and who owns port 8080, after the test ends?
              if [ "$RUNNER_OS" = "Windows" ]; then
                sleep 2
                echo "---- 2s after the end of the test"
                powershell -NoProfile -Command "Get-CimInstance Win32_Process -Filter \"Name='test-05.exe'\" | Select-Object ProcessId,ParentProcessId,CreationDate | Format-Table -AutoSize | Out-String -Width 200"
                netstat -ano | grep -E ':8080 .*LISTENING' || echo "nobody listening on 8080"
              fi

              wait_workers
            done
          done

      # Already built by the steps above
      - name: Run test-01 (worker backlog)
        shell: bash
        run: SERVERINO_TEST_BACKLOG=1 ./tests/test-01/test-01

      - name: Run test-02 (worker backlog)
        shell: bash
        run: SERVERINO_TEST_BACKLOG=1 ./tests/test-02/test-02

      - name: Build examples
        run: dub build --build=release --root=examples/01_hello_world/
              && dub build --root=examples/02_priority/
              && dub build --root=examples/03_form/
              && dub build --root=examples/04_html_dom/
              && dub build --root=examples/05_websocket_echo/
              && dub build --root=examples/06_websocket_noise_stream/
              && dub build --root=examples/07_websocket_callback/
              && dub build --root=examples/08_cmdline_args/
              && dub build --root=examples/09_simple_session/
              && dub build --root=examples/10_diet_ng_templates/
              && dub build --root=examples/11_elemi_integration/
              
      - name: Build https examples
        if: ${{ matrix.os != 'windows-latest' }}
        run: dub build --build=release --root=examples/12_https/
              && dub build --build=release --root=examples/13_letsencrypt/

      - name: Test https example
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          cd examples/12_https
          ./https_example &
          PID=$!
          sleep 1
          curl -kv https://localhost:8443 --retry 5 --retry-connrefused --retry-delay 1 | grep "You are connected via HTTPS"
          EXIT_CODE=$?
          # The same process also serves plain http on another listener
          [ "$EXIT_CODE" = "0" ] && curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ | grep -q "^301$"
          EXIT_CODE=$?
          [ "$EXIT_CODE" = "0" ] && curl -s http://localhost:8080/insecure | grep "connected via plain HTTP"
          EXIT_CODE=$?
          kill $PID
          exit $EXIT_CODE
        
