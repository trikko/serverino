name: BUILD & TEST

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest, ubuntu-24.04-arm]
        dc: [ldc-latest, dmd-2.109.0, dmd-latest]
        exclude:
        - os: ubuntu-24.04-arm
          dc: dmd-2.109.0
        - os: ubuntu-24.04-arm
          dc: dmd-latest
        - os: macos-14
          dc: dmd-2.109.0
        - os: macos-14
          dc: dmd-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Run sanity checks
        if: ${{ matrix.dc != 'ldc-latest' }}
        run: echo "import serverino; mixin ServerinoMain; @endpoint void a(Output o) { }" | dmd -i -Isource -ofinline_1 - &&
             echo "import serverino; mixin ServerinoMain; @endpoint void a(Request r, Output o) { }" | dmd -i -Isource -ofinline_2 - &&
             echo "import serverino; mixin ServerinoMain; @endpoint void a(Request r) { }" | dmd -i -Isource -ofinline_3 - &&
             echo "import serverino; mixin ServerinoBackground; @endpoint void a(Request r) { } void main() { }" | dmd -i -Isource -ofinline_4 -

      - name: Setup OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl
          echo "CPATH=$(brew --prefix openssl)/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix openssl)/lib" >> $GITHUB_ENV
          echo "$(brew --prefix openssl)/bin" >> $GITHUB_PATH
          
      # Builds tests/test-* and the examples, then runs the tests (tests/all.d)
      - name: Build and run tests, build examples
        run: dub test --compiler=${{ env.DC }}

      - name: Test https example
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          cd examples/12_https
          ./https_example &
          PID=$!
          sleep 1
          curl -kv https://localhost:8443 --retry 5 --retry-connrefused --retry-delay 1 | grep "You are connected via HTTPS"
          EXIT_CODE=$?
          # The same process also serves plain http on another listener
          [ "$EXIT_CODE" = "0" ] && curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ | grep -q "^301$"
          EXIT_CODE=$?
          [ "$EXIT_CODE" = "0" ] && curl -s http://localhost:8080/insecure | grep "connected via plain HTTP"
          EXIT_CODE=$?
          kill $PID
          exit $EXIT_CODE
        
